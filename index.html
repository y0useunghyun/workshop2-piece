<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIECE WORKSHOP</title>
<script>
      (function(d) {
        var config = {
          kitId: 'vie5vnf',
          scriptTimeout: 3000,
          async: true
        },
        h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s)

<link rel="stylesheet" href="style.css">
<style>
  /* 앞면: 원색 조각 바닥 + 그 위에 떨어진 151번째 조각, 영수증 */
  .cover { flex: 1; position: relative; overflow: hidden; }
  .cover-floor { position: absolute; inset: 0; touch-action: none; cursor: grab; }
  .cover-floor.dragging { cursor: grabbing; }
  .receipt {
    /* 화면이 낮으면 넘치지 않게 높이 기준으로도 줄임. 안쪽 크기는 전부 em이라 함께 커짐 */
    position: absolute; width: min(88vw, 440px, 56dvh); transform: translate(-50%, -50%) rotate(var(--r, -2deg));
    filter: drop-shadow(0 8px 12px rgba(40, 30, 20, .3));
  }
  .paper { padding: 1.45em 1.35em 1.65em; background: #fff; color: var(--ink); font-size: calc(min(88vw, 440px, 56dvh) * .053); line-height: 1.45; }
  .cover-title { margin: 0; font-size: 4em; font-weight: 700; line-height: .9; letter-spacing: .04em; text-align: center; height: .68em; overflow: hidden; }
  .brand { margin: .5em 0 0; text-align: center; letter-spacing: .32em; font-size: 1.11em; }
  .names { margin: .35em 0 0; text-align: center; }
  .dates { margin: .35em 0 .7em; text-align: center; font-size: .89em; color: var(--muted); }
  .rule { border: 0; border-top: 2px dotted var(--ink); margin: .55em 0; }
  .row { display: flex; justify-content: space-between; color: var(--part); font-weight: 700; font-size: 1.11em; }
  .total { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.22em; }
  .meta { margin: 0; font-size: 1em; }
  .meta a { color: inherit; text-decoration: none; border-bottom: 2px dotted currentColor; }
  .enter { display: block; margin-top: .8em; color: inherit; text-decoration: none; text-align: center; font-size: .89em; letter-spacing: .24em; }
  .enter svg { display: block; width: 100%; height: 3.5em; margin-bottom: .35em; }
  .enter:hover svg { opacity: .6; }
  .meta a:focus-visible, .enter:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .cover-sound { position: fixed; z-index: 3; right: 22px; bottom: 16px; padding: 2px 8px; font-size: 19px; color: var(--ink); background: #fff; }
</style>
</head>
<body>
<main class="cover">
  <div class="cover-floor">
    <article class="receipt" aria-label="PIECE WORKSHOP 영수증">
      <div class="paper">
        <h1 class="cover-title" aria-label="PIECE"><span aria-hidden="true" data-part="모자">P</span><span aria-hidden="true" data-part="상의">I</span><span aria-hidden="true" data-part="하의">E</span><span aria-hidden="true" data-part="신발">C</span><span aria-hidden="true" data-part="아이템">E</span></h1>
        <p class="brand">WORKSHOP</p>
        <p class="names">승현 서빈 물결 하린 하연</p>
        <p class="dates">2026.10.30 — 2026.11.28</p>
        <hr class="rule">
        <div class="row" data-part="모자"><span>HAT</span><span>30</span></div><div class="row" data-part="상의"><span>TOP</span><span>30</span></div><div class="row" data-part="하의"><span>BOTTOM</span><span>30</span></div><div class="row" data-part="신발"><span>SHOES</span><span>30</span></div><div class="row" data-part="아이템"><span>ITEM</span><span>30</span></div>
        <hr class="rule">
        <div class="total"><span>TOTAL</span><span>150 PIECES</span></div>
        <hr class="rule">
        <p class="meta">배정 <a href="https://y0useunghyun.github.io/daily-outfit/" target="_blank" rel="noopener">아웃핏 사이트</a></p>
        <a class="enter" href="home.html" aria-label="PIECE WORKSHOP 안으로 들어가기"><svg viewBox="0 0 100 20" preserveAspectRatio="none" aria-hidden="true"></svg>ENTER</a>
      </div>
    </article>
  </div>
</main>
<button class="sound cover-sound" type="button" aria-pressed="false">SOUND OFF</button>

<script src="data.js"></script>
<script src="floor.js"></script>
<script src="sound.js"></script>
<script src="cover.js"></script>
</body>
</html>
