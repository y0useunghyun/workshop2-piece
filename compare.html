<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>색 비교</title>
<meta name="robots" content="noindex">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font: 15px/1.4 system-ui, sans-serif; color: #111; background: #fff; height: 100dvh; display: flex; flex-direction: column; }
  nav { display: flex; gap: 6px; padding: 10px 16px; flex-wrap: wrap; }
  nav button { font: inherit; padding: 6px 12px; border: 1px solid #111; background: #fff; cursor: pointer; }
  nav button[aria-pressed="true"] { background: #111; color: #fff; }
  .pair { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px 16px; min-height: 0; }
  figure { display: flex; flex-direction: column; min-height: 0; }
  figcaption { padding: 4px 0 6px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  figcaption i { width: 14px; height: 14px; display: inline-block; }
  iframe { flex: 1; width: 100%; border: 1px solid #ddd; }
  @media (max-width: 700px) { .pair { grid-template-columns: 1fr; } iframe { min-height: 70dvh; } }
</style>
</head>
<body>
<nav id="pages"></nav>
<div class="pair">
  <figure><figcaption><b>C. 밤색 × 하늘색</b> <span id="sc"></span></figcaption><iframe id="fc" title="C 팔레트"></iframe></figure>
  <figure><figcaption><b>E. 라임 × 바이올렛</b> <span id="se"></span></figcaption><iframe id="fe" title="E 팔레트"></iframe></figure>
</div>
<script>
const PAGES = [
  ['앞면', 'index.html'],
  ['안쪽 홈', 'home.html'],
  ['GAME', 'game.html'],
  ['아웃핏 배정', 'https://y0useunghyun.github.io/daily-outfit/'],
];
const NAMES = ['물결', '서빈', '승현', '하린', '하연'];
const SWATCH = { c: ['#8A4B2A', '#6EC8FF', '#FF7F11', '#FFD84D', '#FF4F6D'], e: ['#C8F32B', '#6A2BFF', '#FF2E93', '#00D4C0', '#FF7A00'] };
for (const k of ['c', 'e'])
  document.getElementById('s' + k).innerHTML = NAMES.map((n, i) => `<i style="background:${SWATCH[k][i]}"></i>${n}`).join(' ');
const nav = document.getElementById('pages');
function show(i) {
  const url = PAGES[i][1];
  document.getElementById('fc').src = url;
  document.getElementById('fe').src = url + '?p=e';
  nav.querySelectorAll('button').forEach((b, j) => b.setAttribute('aria-pressed', i === j));
}
nav.append(...PAGES.map(([label], i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = label; b.onclick = () => show(i);
  return b;
}));
show(0);
</script>
</body>
</html>
