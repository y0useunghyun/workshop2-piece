<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAME — 워크숍 2 피스</title>
<script>

<link rel="stylesheet" href="style.css">
<style>
  body { height: auto; min-height: 100dvh; overflow: auto; }
  .game {
    flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 420px);
    gap: 32px; padding: 8px 22px 22px; align-items: start;
  }
  .stage-wrap { display: grid; gap: 14px; justify-items: center; }
  .stage { width: min(100%, calc((100dvh - 150px) * .75)); }
  .tabs button {
    background: none; border: 0; padding: 0; font: inherit; color: var(--muted); cursor: pointer;
  }
  .tabs button[aria-pressed="true"] { text-decoration: underline; text-underline-offset: 3px; }
  .picker { display: grid; gap: 14px; position: sticky; top: 12px; }
  .tabs { display: flex; gap: 14px; }
  .picker-head { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; }
  .grid {
    list-style: none; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    max-height: calc(100dvh - 160px); overflow: auto;
  }
  .grid button {
    width: 100%; aspect-ratio: 1; padding: 8px; background: #fff; border: 1px solid transparent; cursor: pointer;
  }
  .grid button[aria-pressed="true"] { border-color: var(--ink); background: #fff; }
  .grid button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .grid img { width: 100%; height: 100%; object-fit: contain; }
  @media (max-width: 760px) {
    .game { grid-template-columns: 1fr; }
    .stage { width: min(100%, 420px); }
    .picker { position: static; }
    .grid { max-height: none; grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<header>
  <a class="logo" href="home.html" aria-label="PIECE"><span aria-hidden="true" data-part="모자">P</span><span aria-hidden="true" data-part="상의">I</span><span aria-hidden="true" data-part="하의">E</span><span aria-hidden="true" data-part="신발">C</span><span aria-hidden="true" data-part="아이템">E</span></a>
  <nav>
    <a href="game.html" aria-current="page">GAME</a><a href="#" data-about>ABOUT</a>
  </nav>
</header>
<main class="game">
  <section class="stage-wrap" aria-label="룩북">
    <div class="stage"></div>
  </section>
  <section class="picker" aria-label="옷 고르기">
    <div class="picker-head">
      <div class="tabs" role="toolbar" aria-label="부위"></div>
      <button class="sound" type="button" aria-pressed="false">SOUND OFF</button>
    </div>
    <ul class="grid"></ul>
  </section>
</main>

<script src="data.js"></script>
<script src="about.js" defer></script>
<script src="sound.js"></script>
<script src="floor.js"></script>
<script src="stage.js"></script>
<script>
Floor.backdrop(document.querySelector('.backdrop'));

const { PARTS } = Stage;
const PART_EN = { 모자: 'HAT', 상의: 'TOP', 하의: 'BOTTOM', 신발: 'SHOES', 아이템: 'ITEM' };
const PART_KEY = { 모자: 'hat', 상의: 'top', 하의: 'bottom', 신발: 'shoes', 아이템: 'item' };

const stage = document.querySelector('.stage');
const tabs = document.querySelector('.tabs');
const grid = document.querySelector('.grid');
const byId = new Map(PIECES.map(p => [p.id, p]));
const piecesOf = part => PIECES.filter(p => p.part === part);

// 룩북 상태는 주소에 저장 → 링크로 공유 가능 (?top=10-30/상의_서빈 …)
const params = new URLSearchParams(location.search);
let look = Object.fromEntries(PARTS.map(part => {
  const p = byId.get(params.get(PART_KEY[part]));
  return [part, p && p.part === part ? p.id : null];
}));
let active = PARTS.find(part => look[part]) ?? '상의';
// 공유 링크에 저장된 위치·크기·겹침 순서 복원
const keyToPart = Object.fromEntries(PARTS.map(part => [PART_KEY[part], part]));
const savedOrder = (params.get('z') ?? '').split(',').map(k => keyToPart[k]).filter(Boolean);
const board = Stage.create(stage, {
  offsets: Object.fromEntries(PARTS.map(part => {
    const v = (params.get(`${PART_KEY[part]}_at`) ?? '').split(',').map(Number);
    const ok = (v.length === 2 || v.length === 3) && v.every(Number.isFinite);
    return [part, ok ? [v[0], v[1], Stage.clampScale(v[2] ?? 1)] : Stage.NO_OFFSET];
  })),
  order: [...Stage.DEFAULT_ORDER.filter(p => !savedOrder.includes(p)), ...new Set(savedOrder)],
  onChange(part) {
    if (part) active = part; // 끌어서 옮긴 옷의 탭으로
    saveToUrl();
    renderPicker();
    Sound.sync(look, board.offsets);
  },
  onTap: part => update(look, part), // 누르면 그 부위 탭으로
});

function saveToUrl() {
  const q = new URLSearchParams();
  PARTS.forEach(part => {
    if (!look[part]) return;
    q.set(PART_KEY[part], look[part]);
    const [dx, dy, sc] = board.offsets[part];
    if (dx || dy || sc !== 1) q.set(`${PART_KEY[part]}_at`, `${dx.toFixed(1)},${dy.toFixed(1)},${sc.toFixed(2)}`);
  });
  if (q.toString()) q.set('z', board.order.map(part => PART_KEY[part]).join(','));
  history.replaceState(null, '', q.toString() ? `?${q}` : location.pathname);
}

const renderStage = () => board.render(Object.fromEntries(PARTS.map(part => [part, byId.get(look[part])])));

function renderPicker() {
  tabs.replaceChildren(...PARTS.map(part => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = PART_EN[part];
    b.dataset.part = part;
    b.setAttribute('aria-pressed', part === active);
    return b;
  }));
  grid.replaceChildren(...piecesOf(active).map(p => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.id = p.id;
    b.setAttribute('aria-pressed', look[active] === p.id);
    b.setAttribute('aria-label', p.person ? `${p.person}의 ${p.part}` : p.part);
    const img = document.createElement('img');
    img.src = p.src;
    img.alt = '';
    img.loading = 'lazy';
    img.style.transform = `rotate(${p.rot}deg)`;
    b.append(img);
    li.append(b);
    return li;
  }));
}

function update(nextLook, nextActive = active) {
  look = nextLook;
  active = nextActive;
  saveToUrl();
  renderStage();
  renderPicker();
  Sound.sync(look, board.offsets);
}

tabs.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) update(look, b.dataset.part);
});
grid.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  // 같은 옷을 다시 누르면 벗기기
  board.front(active); // 새로 입힌 옷도 맨 위로
  update({ ...look, [active]: look[active] === b.dataset.id ? null : b.dataset.id });
});
// 소리는 누를 때만 켜짐 (브라우저 자동재생 정책 + 갑자기 소리 나는 것 방지)
const soundBtn = document.querySelector('.sound');
soundBtn.addEventListener('click', () => {
  const on = Sound.toggle();
  Sound.sync(look, board.offsets);
  soundBtn.setAttribute('aria-pressed', on);
  soundBtn.textContent = on ? 'SOUND ON' : 'SOUND OFF';
});

renderStage();
renderPicker();
Sound.sync(look, board.offsets);
</script>
</body>
</html>
