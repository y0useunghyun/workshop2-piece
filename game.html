<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAME — 워크숍 2 피스</title>
<link rel="stylesheet" href="style.css">
<style>
  body { height: auto; min-height: 100dvh; overflow: auto; }
  .game {
    flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 420px);
    gap: 32px; padding: 8px 22px 22px; align-items: start;
  }
  .stage-wrap { display: grid; gap: 14px; justify-items: center; }
  /* 바닥에 옷을 펼쳐놓은 룩북 한 장 */
  .stage {
    position: relative; width: min(100%, calc((100dvh - 150px) * .75)); aspect-ratio: 3 / 4;
    container-type: size;
  }
  .slot {
    position: absolute;
    /* 드래그로 옮긴 만큼(--dx, --dy: 바닥 대비 %) 이동, --s 만큼 확대 */
    transform: translateX(-50%) translate(calc(var(--dx, 0) * 1cqw), calc(var(--dy, 0) * 1cqh)) scale(var(--s, 1));
    touch-action: none;
    display: grid; place-items: center;
    background: none; border: 0; padding: 0; cursor: grab;
  }
  .slot.dragging { cursor: grabbing; }
  .slot img {
    pointer-events: none; -webkit-user-drag: none; user-select: none;
    width: 100%; height: 100%; object-fit: contain;
    filter: drop-shadow(0 3px 4px rgba(40, 30, 20, .18));
  }
  .slot[data-part="모자"]   { left: 50%; top: 1%;  width: 30%; height: 17%; }
  .slot[data-part="상의"]   { left: 46%; top: 17%; width: 58%; height: 36%; }
  .slot[data-part="하의"]   { left: 46%; top: 50%; width: 46%; height: 36%; }
  .slot[data-part="신발"]   { left: 46%; top: 86%; width: 34%; height: 13%; }
  .slot[data-part="아이템"] { left: 86%; top: 42%; width: 28%; height: 30%; }
  .slot:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .tabs button {
    background: none; border: 0; padding: 0; font: inherit; color: var(--muted); cursor: pointer;
  }
  .tabs button[aria-pressed="true"] { color: var(--ink); }
  .tabs button[aria-pressed="true"] { text-decoration: underline; text-underline-offset: 3px; }
  .picker { display: grid; gap: 14px; position: sticky; top: 12px; }
  .tabs { display: flex; gap: 14px; }
  .picker-head { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; }
  .grid {
    list-style: none; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    max-height: calc(100dvh - 160px); overflow: auto;
  }
  .grid button {
    width: 100%; aspect-ratio: 1; padding: 8px; background: #f6f5f2; border: 1px solid transparent; cursor: pointer;
  }
  .grid button[aria-pressed="true"] { border-color: var(--ink); background: #fff; }
  .grid button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .grid img { width: 100%; height: 100%; object-fit: contain; }
  @media (max-width: 760px) {
    .game { grid-template-columns: 1fr; }
    .stage { width: min(100%, 420px); }
    .picker { position: static; }
    .grid { max-height: none; grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">PIECE</a>
  <nav>
    <a href="game.html" aria-current="page">GAME</a><a href="#" data-about>ABOUT</a>
  </nav>
</header>
<main class="game">
  <section class="stage-wrap" aria-label="룩북">
    <div class="stage"></div>
  </section>
  <section class="picker" aria-label="옷 고르기">
    <div class="picker-head">
      <div class="tabs" role="toolbar" aria-label="부위"></div>
      <button class="sound" type="button" aria-pressed="false">SOUND OFF</button>
    </div>
    <ul class="grid"></ul>
  </section>
</main>

<script src="data.js"></script>
<script src="about.js" defer></script>
<script src="sound.js"></script>
<script>
const PARTS = ['모자', '상의', '하의', '신발', '아이템'];
const PART_EN = { 모자: 'HAT', 상의: 'TOP', 하의: 'BOTTOM', 신발: 'SHOES', 아이템: 'ITEM' };
const PART_KEY = { 모자: 'hat', 상의: 'top', 하의: 'bottom', 신발: 'shoes', 아이템: 'item' };

const stage = document.querySelector('.stage');
const tabs = document.querySelector('.tabs');
const grid = document.querySelector('.grid');
const byId = new Map(PIECES.map(p => [p.id, p]));
const piecesOf = part => PIECES.filter(p => p.part === part);

// 룩북 상태는 주소에 저장 → 링크로 공유 가능 (?top=10-30/상의_서빈 …)
const params = new URLSearchParams(location.search);
let look = Object.fromEntries(PARTS.map(part => {
  const p = byId.get(params.get(PART_KEY[part]));
  return [part, p && p.part === part ? p.id : null];
}));
let active = PARTS.find(part => look[part]) ?? '상의';
// 옮긴 위치·크기: 부위별 [dx, dy, scale] (dx·dy = 바닥 너비·높이 대비 %)
const DRAG_THRESHOLD = 4;            // px, 이보다 덜 움직이면 클릭으로 처리
const SCALE_MIN = 0.4, SCALE_MAX = 3;
const WHEEL_SPEED = 0.002;           // 휠·트랙패드 핀치 감도
const NO_OFFSET = [0, 0, 1];         // 기본 자리·크기
const clampScale = v => Math.min(SCALE_MAX, Math.max(SCALE_MIN, v));
let offsets = Object.fromEntries(PARTS.map(part => {
  const v = (params.get(`${PART_KEY[part]}_at`) ?? '').split(',').map(Number);
  const ok = (v.length === 2 || v.length === 3) && v.every(Number.isFinite);
  return [part, ok ? [v[0], v[1], clampScale(v[2] ?? 1)] : NO_OFFSET];
}));

// 쌓이는 순서: 뒤에 있을수록 위. 마지막에 만진 옷이 맨 위로
const DEFAULT_ORDER = ['신발', '하의', '상의', '모자', '아이템'];
const keyToPart = Object.fromEntries(PARTS.map(part => [PART_KEY[part], part]));
const savedOrder = (params.get('z') ?? '').split(',').map(k => keyToPart[k]).filter(Boolean);
let order = [...DEFAULT_ORDER.filter(p => !savedOrder.includes(p)), ...new Set(savedOrder)];

function applyZ() {
  stage.querySelectorAll('.slot').forEach(slot => { slot.style.zIndex = order.indexOf(slot.dataset.part) + 1; });
}

function bringToFront(part) {
  if (order.at(-1) === part) return;
  order = [...order.filter(p => p !== part), part];
  applyZ();
  saveToUrl();
}

function saveToUrl() {
  const q = new URLSearchParams();
  PARTS.forEach(part => {
    if (!look[part]) return;
    q.set(PART_KEY[part], look[part]);
    const [dx, dy, sc] = offsets[part];
    if (dx || dy || sc !== 1) q.set(`${PART_KEY[part]}_at`, `${dx.toFixed(1)},${dy.toFixed(1)},${sc.toFixed(2)}`);
  });
  if (q.toString()) q.set('z', order.map(part => PART_KEY[part]).join(','));
  history.replaceState(null, '', q.toString() ? `?${q}` : location.pathname);
}

function applyOffset(slot, [dx, dy, sc]) {
  slot.style.setProperty('--dx', dx);
  slot.style.setProperty('--dy', dy);
  slot.style.setProperty('--s', sc);
}

function renderStage() {
  // 빈 자리는 아무것도 안 그림 (자리 표시 없이 입힌 옷만)
  stage.replaceChildren(...PARTS.filter(part => look[part]).map(part => {
    const p = byId.get(look[part]);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'slot';
    b.dataset.part = part;
    applyOffset(b, offsets[part]);
    b.setAttribute('aria-label', p.person ? `${p.person}의 ${p.part}` : p.part);
    const img = document.createElement('img');
    img.src = p.src;
    img.alt = '';
    img.draggable = false;
    img.style.transform = `rotate(${p.rot}deg)`;
    b.append(img);
    return b;
  }));
  applyZ();
}

function renderPicker() {
  tabs.replaceChildren(...PARTS.map(part => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = PART_EN[part];
    b.dataset.part = part;
    b.setAttribute('aria-pressed', part === active);
    return b;
  }));
  grid.replaceChildren(...piecesOf(active).map(p => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.id = p.id;
    b.setAttribute('aria-pressed', look[active] === p.id);
    b.setAttribute('aria-label', p.person ? `${p.person}의 ${p.part}` : p.part);
    const img = document.createElement('img');
    img.src = p.src;
    img.alt = '';
    img.loading = 'lazy';
    img.style.transform = `rotate(${p.rot}deg)`;
    b.append(img);
    li.append(b);
    return li;
  }));
}

function update(nextLook, nextActive = active, nextOffsets = offsets) {
  look = nextLook;
  offsets = nextOffsets;
  active = nextActive;
  saveToUrl();
  renderStage();
  renderPicker();
  Sound.sync(look, offsets);
}

// 바닥 위 옷: 한 손가락/마우스 = 옮기기, 두 손가락 = 크기, 휠·트랙패드 핀치 = 크기
const pointers = new Map(); // pointerId → {x, y}
let gesture = null;         // { slot, part, start: [dx,dy,s], x, y, dist, moved, next }
let justDragged = false;    // 드래그 직후 따라오는 click 무시
const distance = () => {
  const [a, b] = [...pointers.values()];
  return Math.hypot(a.x - b.x, a.y - b.y);
};

stage.addEventListener('pointerdown', e => {
  const slot = e.target.closest('.slot');
  if (!slot) return;
  e.preventDefault(); // 이미지 기본 끌기(드래그앤드롭) 막기
  slot.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const part = slot.dataset.part;
  bringToFront(part);
  if (!gesture) {
    gesture = { slot, part, start: offsets[part], x: e.clientX, y: e.clientY, moved: false, next: offsets[part] };
  } else if (pointers.size === 2 && gesture.slot === slot) {
    gesture.dist = distance();          // 두 번째 손가락 → 핀치 시작
    gesture.start = gesture.next;
  }
});
stage.addEventListener('pointermove', e => {
  if (!gesture || !pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const [dx, dy, sc] = gesture.start;
  if (pointers.size >= 2 && gesture.dist) {
    gesture.next = [gesture.next[0], gesture.next[1], clampScale(sc * distance() / gesture.dist)];
  } else {
    const mx = e.clientX - gesture.x, my = e.clientY - gesture.y;
    if (!gesture.moved && Math.hypot(mx, my) < DRAG_THRESHOLD) return;
    gesture.next = [dx + mx / stage.clientWidth * 100, dy + my / stage.clientHeight * 100, sc];
  }
  gesture.moved = true;
  gesture.slot.classList.add('dragging');
  applyOffset(gesture.slot, gesture.next);
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (!gesture || pointers.size) return; // 손가락이 남아 있으면 계속
  const { part, moved, next } = gesture;
  gesture = null;
  if (!moved) return; // 그냥 누른 건 click에서 처리
  justDragged = true;
  setTimeout(() => { justDragged = false; }); // click이 안 따라오는 브라우저 대비
  update(look, part, { ...offsets, [part]: next });
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);

let wheelTimer;
stage.addEventListener('wheel', e => {
  const slot = e.target.closest('.slot');
  if (!slot) return;
  e.preventDefault(); // 페이지 스크롤·브라우저 확대 대신 옷 크기 조절
  const part = slot.dataset.part;
  bringToFront(part);
  const [dx, dy, sc] = offsets[part];
  offsets = { ...offsets, [part]: [dx, dy, clampScale(sc * Math.exp(-e.deltaY * WHEEL_SPEED))] };
  applyOffset(slot, offsets[part]);
  Sound.sync(look, offsets);
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(saveToUrl, 200);
}, { passive: false });
stage.addEventListener('click', e => {
  if (justDragged) { justDragged = false; return; }
  const slot = e.target.closest('.slot');
  if (slot) update(look, slot.dataset.part); // 누르면 그 부위 탭으로
});
tabs.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) update(look, b.dataset.part);
});
grid.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  // 같은 옷을 다시 누르면 벗기기
  bringToFront(active); // 새로 입힌 옷도 맨 위로
  update({ ...look, [active]: look[active] === b.dataset.id ? null : b.dataset.id });
});
// 소리는 누를 때만 켜짐 (브라우저 자동재생 정책 + 갑자기 소리 나는 것 방지)
const soundBtn = document.querySelector('.sound');
soundBtn.addEventListener('click', () => {
  const on = Sound.toggle();
  Sound.sync(look, offsets);
  soundBtn.setAttribute('aria-pressed', on);
  soundBtn.textContent = on ? 'SOUND ON' : 'SOUND OFF';
});

renderStage();
renderPicker();
Sound.sync(look, offsets);
</script>
</body>
</html>
